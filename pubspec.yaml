name: fleetcheck
description: FleetCheck - Inspect. Verify. Drive with Confidence.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^13.2.0

  # Network
  dio: ^5.4.3
  connectivity_plus: ^6.0.3

  # Local Storage
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.0.0

  # Firebase
  firebase_core: ^2.31.0
  firebase_messaging: ^14.9.2
  firebase_analytics: ^10.10.2
  firebase_crashlytics: ^3.5.2

  # QR Scanner
  mobile_scanner: ^5.2.2

  # Location / GPS
  geolocator: ^11.1.0
  geocoding: ^3.0.0
  google_maps_flutter: ^2.6.1

  # PDF
  pdf: ^3.11.1
  printing: ^5.13.0
  path_provider: ^2.1.3

  # Sharing
  share_plus: ^9.0.0
  url_launcher: ^6.3.0

  # Image
  image_picker: ^1.1.1
  cached_network_image: ^3.3.1

  # UI
  google_fonts: ^6.2.1
  intl: ^0.19.0
  permission_handler: ^11.3.1
  shimmer: ^3.0.0
  flutter_local_notifications: ^17.2.2
  pinput: ^5.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
